<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mumbai Insider</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6A50'/%3E%3Ctext x='50%25' y='55%25' font-size='20' text-anchor='middle' dominant-baseline='middle' fill='white' font-family='sans-serif' font-weight='700'%3EM%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B0D12; --bg-2:#0F1218; --surface:#151A22; --surface-2:#1A1F28;
  --elevated:#1F2632; --border:#242A36; --border-2:#323949;
  --text:#ECEEF3; --text-2:#C7CBD6; --muted:#8A93A6; --muted-2:#5C6577;
  --accent:#FF6A50; --accent-2:#FF8A6E; --accent-glow:rgba(255,106,80,.22);
  --success:#2ECC8F; --amber:#F2A93C; --danger:#FF5470;
  --ease-spring:cubic-bezier(.32,.72,0,1);
  --f-display:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{
  font-family:var(--f-body);color:var(--text);background:var(--bg);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  letter-spacing:-.005em;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1200px 800px at 12% -10%, rgba(255,106,80,.10), transparent 60%),
    radial-gradient(900px 700px at 100% 12%, rgba(80,120,255,.06), transparent 60%),
    radial-gradient(1000px 900px at 50% 120%, rgba(255,106,80,.05), transparent 60%);
}

/* ============ STAGE ============ */
.stage{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;gap:20px;padding:26px 20px 60px;position:relative;z-index:2;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em}
.brand-mark{
  width:26px;height:26px;border-radius:7px;position:relative;flex-shrink:0;
  background:linear-gradient(140deg,#FF7B5C,#FF5030);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35), 0 6px 16px -6px var(--accent-glow);
}
.brand-mark::after{content:'';position:absolute;inset:6px;border-radius:4px;border:1.5px solid rgba(255,255,255,.35);border-bottom:none;border-right:none;transform:rotate(45deg)}
.brand-name{font-size:14px}
.brand-name em{font-style:normal;color:var(--muted)}

.hint{
  font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.14em;
  text-transform:uppercase;text-align:center;
}
.hint b{color:var(--text);font-weight:500}

/* ============ PHONE ============ */
.phone-shell{
  position:relative;width:380px;height:800px;padding:14px;border-radius:58px;
  background:linear-gradient(160deg,#2f3239 0%, #1a1c22 45%, #2a2d34 100%);
  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.09),
    inset 0 1px 0 rgba(255,255,255,.18),
    0 30px 60px -20px rgba(0,0,0,.75),
    0 50px 120px -30px rgba(255,106,80,.18);
}
.phone-shell::before{content:'';position:absolute;right:-2px;top:170px;width:3px;height:78px;background:linear-gradient(90deg,#3a3d44,#20232a);border-radius:2px 0 0 2px}
.phone-shell::after{content:'';position:absolute;left:-2px;top:130px;width:3px;height:36px;background:linear-gradient(90deg,#20232a,#3a3d44);border-radius:0 2px 2px 0;box-shadow:0 50px 0 #3a3d44, 0 96px 0 #3a3d44}
.viewport{
  --p-bg:#0F1218; --p-surface:#161B24; --p-surface-2:#1C222D;
  --p-elevated:#1F2632; --p-border:#242C3A; --p-border-2:#2E3646;
  --p-text:#ECEEF3; --p-text-2:#B7BCC9; --p-muted:#8A93A6; --p-muted-2:#606A7D;
  --p-accent:#FF6A50; --p-accent-2:#FF8A6E; --p-success:#2ECC8F;
  --p-amber:#F2A93C; --p-danger:#FF5470;
  position:relative;width:100%;height:100%;background:#000;border-radius:46px;overflow:hidden;
  box-shadow:inset 0 0 0 1.5px #000, inset 0 0 0 2.5px rgba(255,255,255,.03);
  color:var(--p-text);font-family:var(--f-body);
}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:106px;height:30px;background:#000;border-radius:20px;z-index:80}
.island::after{content:'';position:absolute;right:12px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 30% 30%, #2a2f3b, #0a0d13 70%)}
.home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:4px;border-radius:3px;background:rgba(255,255,255,.55);z-index:80}
.statusbar{
  position:absolute;top:0;left:0;right:0;height:52px;
  display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;
  font-size:14px;font-weight:600;color:var(--p-text);z-index:60;pointer-events:none;letter-spacing:-.01em;
}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.sb-bat{width:24px;height:12px;border:1.5px solid var(--p-text);border-radius:3px;position:relative;opacity:.9}
.sb-bat::after{content:'';position:absolute;right:-3.5px;top:3.5px;width:2px;height:5px;background:var(--p-text);border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;top:1.5px;left:1.5px;bottom:1.5px;width:72%;background:var(--p-text);border-radius:1px}

/* ============ SCREEN SYSTEM ============ */
.screen-viewport{position:absolute;inset:0;overflow:hidden;background:var(--p-bg)}
.screen{
  position:absolute;inset:0;padding-top:52px;overflow-y:auto;background:var(--p-bg);
  opacity:0;visibility:hidden;transform:translateY(8px);
  transition:opacity .28s var(--ease-spring), transform .35s var(--ease-spring);
  -ms-overflow-style:none;scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.screen.active{opacity:1;visibility:visible;transform:none;z-index:5}
.screen.with-tabbar{padding-bottom:88px}
.screen.with-cta-bar{padding-bottom:96px}

.hdr{display:flex;align-items:center;gap:10px;padding:10px 20px 12px}
.hdr h3{font-family:var(--f-display);font-size:18px;font-weight:600;margin:0;flex:1;letter-spacing:-.02em}
.icon-btn{
  all:unset;display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;cursor:pointer;color:var(--p-text);
  background:rgba(255,255,255,.04);border:1px solid transparent;
  transition:background .2s, border-color .2s, transform .15s var(--ease-spring);
}
.icon-btn:hover{background:rgba(255,255,255,.08);border-color:var(--p-border)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px}
.icon-btn.compact{width:30px;height:30px}
.icon-btn.compact svg{width:15px;height:15px}

.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--p-muted)}
.err{color:var(--p-danger);font-size:12px;margin-top:6px}

.btn{
  all:unset;box-sizing:border-box;font-family:var(--f-body);font-weight:600;font-size:14px;
  text-align:center;cursor:pointer;padding:14px 22px;border-radius:14px;
  transition:filter .2s, transform .12s var(--ease-spring);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.005em;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{
  background:linear-gradient(180deg,var(--p-accent-2),var(--p-accent));color:#160805;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 8px 24px -8px var(--accent-glow), 0 1px 0 rgba(0,0,0,.4);
}
.btn-primary:hover{filter:brightness(1.06)}
.btn-block{display:flex;width:100%}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--p-text);border:1px solid var(--p-border)}
.btn-ghost:hover{background:rgba(255,255,255,.09)}
.btn-outline{background:transparent;color:var(--p-text);border:1px solid var(--p-border-2)}
.btn-danger{background:rgba(255,84,112,.12);color:var(--p-danger);border:1px solid rgba(255,84,112,.3)}
.btn-sm{padding:9px 14px;font-size:12.5px}

/* ============ SIGN-IN / SIGN-UP ============ */
.auth-wrap{padding:36px 26px 24px;height:calc(100% - 52px);display:flex;flex-direction:column}
.auth-hero{margin-bottom:24px}
.auth-hero .eyebrow{margin-bottom:8px;color:var(--p-accent)}
.auth-hero h1{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1.1;letter-spacing:-.028em;margin:0 0 8px}
.auth-hero p{font-size:13.5px;color:var(--p-text-2);margin:0;line-height:1.55}
.auth-form{display:flex;flex-direction:column;gap:12px}
.auth-form label{display:block;font-size:11px;font-weight:600;color:var(--p-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.auth-form input{
  width:100%;background:var(--p-surface);border:1px solid var(--p-border);border-radius:12px;
  padding:13px 14px;font-family:var(--f-body);font-size:14px;color:var(--p-text);outline:none;
  transition:border-color .2s;
}
.auth-form input:focus{border-color:var(--p-accent)}
.auth-form input::placeholder{color:var(--p-muted-2)}
.auth-switch{margin-top:16px;font-size:12.5px;color:var(--p-muted);text-align:center}
.auth-switch a{color:var(--p-accent);text-decoration:none;font-weight:600;cursor:pointer;margin-left:4px}
.auth-guest{margin-top:auto;text-align:center;padding-top:16px;border-top:1px dashed var(--p-border);font-size:12px;color:var(--p-muted)}
.auth-guest a{color:var(--p-accent);cursor:pointer;font-weight:600;margin-left:4px}

.admin-note{
  margin-top:12px;padding:11px 14px;background:rgba(255,106,80,.08);border:1px dashed rgba(255,106,80,.3);
  border-radius:10px;font-size:11.5px;color:var(--p-text-2);line-height:1.55;
}
.admin-note b{color:var(--p-accent);display:block;margin-bottom:2px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}

/* ============ ONBOARDING ============ */
.ob-media{
  position:relative;height:240px;overflow:hidden;
  background:radial-gradient(circle at 50% 60%, rgba(255,106,80,.28), transparent 60%),radial-gradient(circle at 50% 10%, rgba(80,120,255,.15), transparent 55%);
}
.ob-orb{
  position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFA88E,#FF6A50 55%,#B03818);
  box-shadow:0 30px 60px -12px rgba(255,106,80,.5), inset 0 -20px 40px rgba(0,0,0,.3), inset 0 2px 8px rgba(255,255,255,.5);
}
.ob-ring{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.14);border-radius:50%}
.ob-ring.r1{width:170px;height:170px}
.ob-ring.r2{width:220px;height:220px;border-color:rgba(255,255,255,.09)}
.ob-copy{padding:22px 22px 24px;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 240px - 52px)}
.ob-copy h2{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:6px 0 0}
.ob-copy h2 em{font-style:italic;color:var(--p-muted);font-weight:500}
.ob-lead{font-size:13.5px;color:var(--p-text-2);line-height:1.55;margin:0}
.perm-row{
  display:flex;align-items:center;gap:12px;background:var(--p-surface);border:1px solid var(--p-border);
  border-radius:14px;padding:12px 14px;
}
.perm-row svg{width:18px;height:18px;color:var(--p-accent);flex-shrink:0}
.perm-row div{flex:1;min-width:0}
.perm-row b{display:block;font-size:12.5px;font-weight:600}
.perm-row small{display:block;font-size:11px;color:var(--p-muted);margin-top:1px}
.toggle{width:36px;height:22px;border-radius:100px;background:var(--p-border-2);position:relative;flex-shrink:0;transition:background .2s;cursor:pointer;border:none;padding:0}
.toggle i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ease-spring)}
.toggle.on{background:var(--p-success)}
.toggle.on i{transform:translateX(14px)}
.ob-cta{margin-top:auto}

/* ============ HOME ============ */
.home-hdr{padding:6px 20px 8px;display:flex;align-items:center;gap:10px}
.home-hdr .greet{flex:1;min-width:0}
.home-hdr .greet .eyebrow{margin-bottom:2px}
.home-hdr .greet .name{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.loc-banner{
  margin:6px 20px 12px;padding:12px 14px;background:linear-gradient(140deg, rgba(255,106,80,.12), rgba(255,106,80,.03));
  border:1px solid rgba(255,106,80,.28);border-radius:14px;display:flex;align-items:center;gap:12px;
}
.loc-banner svg{width:18px;height:18px;color:var(--p-accent);flex-shrink:0}
.loc-banner .txt{flex:1;min-width:0;font-size:12.5px;line-height:1.45}
.loc-banner .txt b{display:block;font-weight:600}
.loc-banner .txt small{display:block;color:var(--p-muted);font-size:11px;margin-top:2px}
.loc-banner .close{width:24px;height:24px;flex-shrink:0;color:var(--p-muted);cursor:pointer;background:none;border:none;display:flex;align-items:center;justify-content:center;padding:0}
.loc-banner .close:hover{color:var(--p-text)}
.loc-banner .close svg{width:14px;height:14px}

.search-bar{
  display:flex;align-items:center;gap:10px;margin:6px 20px 14px;
  background:var(--p-surface);border:1px solid var(--p-border);border-radius:16px;
  padding:12px 15px;color:var(--p-muted);font-size:14px;cursor:pointer;transition:border-color .2s;
}
.search-bar:hover{border-color:var(--p-border-2)}
.search-bar svg{width:17px;height:17px;flex-shrink:0}
.search-bar input{border:none;background:none;outline:none;font:inherit;color:var(--p-text);width:100%;font-family:var(--f-body)}

.pill-row{display:flex;gap:8px;overflow-x:auto;padding:2px 20px 6px;-ms-overflow-style:none;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.pill{
  flex-shrink:0;font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:100px;
  background:rgba(255,255,255,.05);color:var(--p-text-2);border:1px solid transparent;cursor:pointer;
  white-space:nowrap;transition:background .2s, color .2s, border-color .2s;letter-spacing:-.005em;
}
.pill:hover{background:rgba(255,255,255,.08);color:var(--p-text)}
.pill.on{background:var(--p-text);color:#0B0D12;border-color:var(--p-text)}
.pill .glyph{margin-right:5px}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:20px 20px 10px}
.sec-head h4{font-family:var(--f-display);font-size:16px;font-weight:600;margin:0;letter-spacing:-.02em}
.sec-head a{font-family:var(--f-mono);font-size:10.5px;color:var(--p-accent);font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}

/* listing cards */
.card-list{display:flex;flex-direction:column;gap:10px;padding:6px 20px 8px}
.lcard{
  display:flex;gap:14px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:16px;
  padding:10px;cursor:pointer;
  transition:transform .25s var(--ease-spring), border-color .2s, background .2s;
}
.lcard:hover{transform:translateY(-1px);border-color:var(--p-border-2);background:var(--p-surface-2)}
.lcard .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.lcard h5{font-family:var(--f-display);font-size:13.5px;font-weight:600;margin:0;line-height:1.3;letter-spacing:-.015em}
.lcard .meta{font-size:11.5px;color:var(--p-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lcard .star{color:var(--p-amber);font-weight:600}
.lcard .price{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--p-text);letter-spacing:-.01em}
.lcard .price small{color:var(--p-muted);font-weight:400;font-size:10px}
.lcard .thumb{
  width:78px;height:78px;border-radius:12px;flex-shrink:0;overflow:hidden;
  background:linear-gradient(160deg,#1E2634 0%, #10161F 100%);
  display:flex;align-items:center;justify-content:center;color:var(--p-muted);font-size:26px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.lcard .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.badge{font-family:var(--f-mono);font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:100px;display:inline-flex;align-items:center;gap:4px}
.badge.new{background:rgba(46,204,143,.14);color:var(--p-success)}
.badge.hot{background:rgba(255,106,80,.14);color:var(--p-accent)}

/* live-strip */
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 20px 8px;-ms-overflow-style:none;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.live-card{
  flex-shrink:0;width:220px;position:relative;
  background:linear-gradient(180deg, var(--p-surface), var(--p-surface-2));
  border:1px solid var(--p-border);border-radius:18px;padding:0;cursor:pointer;overflow:hidden;
  transition:transform .3s var(--ease-spring), border-color .2s;
}
.live-card:hover{transform:translateY(-2px);border-color:var(--p-border-2)}
.live-card .thumb{height:120px;position:relative;overflow:hidden;background:linear-gradient(160deg,#1F2A3C,#0F1622)}
.live-card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.live-card .thumb .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px}
.live-card .live-badge{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:9.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#160805;background:var(--p-accent);padding:4px 8px;border-radius:100px}
.live-card .info{padding:12px 14px 14px}
.live-card h5{font-family:var(--f-display);font-size:13.5px;font-weight:600;margin:0 0 4px;line-height:1.3;letter-spacing:-.015em}
.live-card p{font-size:11.5px;margin:0;color:var(--p-muted);line-height:1.4}

.loading, .empty{padding:40px 20px;text-align:center;color:var(--p-muted);font-size:13px}
.loading svg{animation:spin 1s linear infinite;width:22px;height:22px;color:var(--p-accent);margin-bottom:10px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ LISTING DETAIL ============ */
.detail-hero{position:relative;height:280px;overflow:hidden;background:linear-gradient(160deg,#1E2634 0%, #10161F 100%);margin-top:-52px}
.detail-hero img{width:100%;height:100%;object-fit:cover;display:block}
.detail-hero .fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px}
.detail-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:120px;background:linear-gradient(180deg,transparent,var(--p-bg))}
.detail-nav{position:absolute;top:52px;left:14px;right:14px;display:flex;gap:8px;z-index:10}
.detail-nav .icon-btn{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border-color:rgba(255,255,255,.1)}
.detail-nav .spacer{flex:1}
.title-block{padding:16px 20px 4px}
.title-block h2{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:0 0 8px}
.title-block .rate{font-size:12.5px;color:var(--p-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title-block .rate .star{color:var(--p-amber);font-weight:600}
.info-strip{display:flex;gap:0;padding:12px 6px;margin:14px 20px 4px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:14px}

.week{display:flex;gap:8px;padding:6px 20px 4px;overflow-x:auto;-ms-overflow-style:none;scrollbar-width:none}

.day{

.day.sold .s{background:var(--p-muted-2)}
.day.sel{border-color:var(--p-accent);background:rgba(255,106,80,.09);transform:translateY(-2px)}

.slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px 6px}
.slot{border:1px solid var(--p-border);background:var(--p-surface);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;transition:border-color .2s, background .2s}

.slot .t{font-size:14px;font-weight:600;letter-spacing:-.01em}
.slot .s{font-size:11px;margin-top:3px;font-weight:500;color:var(--p-success)}
.slot.sold{opacity:.35;cursor:default}
.slot.sold .s{color:var(--p-muted)}
.slot.few .s{color:var(--p-amber)}

.stepper-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;margin:12px 20px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:14px}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{
  all:unset;width:30px;height:30px;border-radius:50%;background:var(--p-surface-2);border:1px solid var(--p-border);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;font-weight:600;color:var(--p-accent);
}
.stepper button:hover{background:var(--p-elevated)}
.stepper b{font-size:16px;min-width:18px;text-align:center;font-weight:600}

.pay-opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 20px 10px;border:1px solid var(--p-border);background:var(--p-surface);border-radius:14px;cursor:pointer;transition:border-color .2s, background .2s}
.pay-opt.sel{border-color:var(--p-accent);background:rgba(255,106,80,.06)}
.pay-opt .r{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--p-border-2);flex-shrink:0;position:relative}
.pay-opt.sel .r{border-color:var(--p-accent)}
.pay-opt.sel .r::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--p-accent)}
.pay-opt .glyph{width:32px;height:32px;border-radius:8px;background:var(--p-accent);color:#160805;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:11px;font-weight:700;flex-shrink:0}
.pay-opt .lbl{flex:1;font-size:13.5px;font-weight:600}
.pay-opt .lbl small{display:block;font-weight:400;color:var(--p-muted);font-size:11px;margin-top:2px}

.breakdown{margin:8px 20px 6px;padding:14px 16px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:14px}
.bd-row{display:flex;justify-content:space-between;font-size:13px;color:var(--p-text-2);padding:4px 0}
.bd-row.total{border-top:1px dashed var(--p-border-2);margin-top:8px;padding-top:10px;color:var(--p-text);font-weight:700;font-size:15px}

/* ============ CONFIRM ============ */
.confirm-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 26px 24px}
.check-circle{
  width:68px;height:68px;border-radius:50%;
  background:linear-gradient(140deg, rgba(46,204,143,.25), rgba(46,204,143,.08));
  color:var(--p-success);display:flex;align-items:center;justify-content:center;margin-bottom:16px;
  border:1px solid rgba(46,204,143,.35);
}
.check-circle svg{width:34px;height:34px}
.confirm-wrap h2{font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:-.025em;margin:0 0 6px}
.confirm-wrap p{font-size:13px;color:var(--p-text-2);margin:0 0 22px;line-height:1.6}
.qr-card{width:100%;max-width:280px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:18px;padding:20px;margin-bottom:16px}

.qr-card .ev{font-family:var(--f-display);font-size:14px;font-weight:600;margin-bottom:4px;letter-spacing:-.015em}
.qr-card .ev-meta{font-family:var(--f-mono);font-size:10.5px;color:var(--p-muted)}

/* ============ WALLET / TRIPS ============ */
.ticket{margin:0 20px 14px;border-radius:18px;background:var(--p-surface);border:1px solid var(--p-border);overflow:hidden;box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}

.tier-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--p-accent);background:rgba(255,106,80,.1);border:1px solid rgba(255,106,80,.3);padding:5px 12px;border-radius:100px;margin-top:4px;letter-spacing:.1em;text-transform:uppercase}
.progress-card{margin:16px 20px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:16px;padding:16px 18px}

.menu-list{margin:12px 20px 0}
.menu-row{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--p-border);font-size:13px;font-weight:500;cursor:pointer;transition:padding-left .2s}
.menu-row:hover{padding-left:4px}
.menu-row:last-child{border-bottom:none}
.menu-row svg{width:18px;height:18px;color:var(--p-muted)}
.menu-row span{flex:1}
.menu-row small{color:var(--p-muted);font-size:11.5px}
.menu-row.admin-hint{color:var(--p-accent)}
.menu-row.admin-hint svg{color:var(--p-accent)}

/* ============ ADMIN ============ */
.admin-tabs{display:flex;gap:6px;padding:6px 20px 14px}
.admin-tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:12.5px;font-weight:600;background:var(--p-surface);border:1px solid var(--p-border);color:var(--p-muted);cursor:pointer;transition:all .2s}
.admin-tab.on{background:var(--p-text);color:#0B0D12;border-color:var(--p-text)}
.admin-list{padding:0 20px 8px;display:flex;flex-direction:column;gap:10px}
.admin-item{
  display:flex;gap:12px;align-items:center;background:var(--p-surface);border:1px solid var(--p-border);
  border-radius:14px;padding:10px;cursor:pointer;transition:border-color .2s;
}
.admin-item:hover{border-color:var(--p-border-2)}
.admin-item .thumb{width:60px;height:60px;border-radius:10px;flex-shrink:0;overflow:hidden;background:var(--p-surface-2);display:flex;align-items:center;justify-content:center;font-size:22px}
.admin-item .thumb img{width:100%;height:100%;object-fit:cover}
.admin-item .info{flex:1;min-width:0}
.admin-item .info b{display:block;font-family:var(--f-display);font-size:13.5px;font-weight:600;letter-spacing:-.015em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-item .info small{font-size:11px;color:var(--p-muted);display:block;margin-top:2px}
.admin-item .state{font-family:var(--f-mono);font-size:9.5px;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.1em}
.admin-item .state.active{background:rgba(46,204,143,.14);color:var(--p-success)}
.admin-item .state.paused{background:rgba(255,84,112,.14);color:var(--p-danger)}

.form-field{margin:0 20px 12px}

}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 20px 12px}

.upload-box{

  cursor:pointer;transition:border-color .2s, background .2s;position:relative;
}

.upload-box small{display:block;font-size:11px;color:var(--p-muted);margin-top:2px}

/* ============ TAB BAR ============ */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:10px;height:66px;
  background:rgba(15,18,24,.72);border:1px solid var(--p-border);

}
.viewport.show-tabbar .tabbar{display:flex}
.tabbtn{
  all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;
  color:var(--p-muted);padding:8px 0;position:relative;transition:color .2s;
}
.tabbtn svg{width:20px;height:20px;transition:transform .25s var(--ease-spring)}
.tabbtn span{font-size:9.5px;font-weight:600;letter-spacing:.02em}
.tabbtn.on{color:var(--p-accent)}
.tabbtn.on svg{transform:translateY(-1px)}

/* ============ TOAST ============ */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translate(-50%, 10px);
  padding:10px 16px;background:rgba(15,18,24,.95);border:1px solid var(--p-border-2);
  border-radius:100px;font-size:12px;font-weight:500;color:var(--p-text);

  z-index:90;opacity:0;pointer-events:none;transition:opacity .2s, transform .3s var(--ease-spring);
  white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis;
}
.toast.show{opacity:1;transform:translate(-50%, 0)}
.toast.error{background:rgba(255,84,112,.95);color:#fff;border-color:transparent}
.toast.success{background:rgba(46,204,143,.95);color:#04140C;border-color:transparent}

/* ============ MODAL SHEET ============ */
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:70;backdrop-filter:blur(2px)}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:82%;
  background:var(--p-bg);border:1px solid var(--p-border);border-bottom:none;
  border-radius:24px 24px 0 0;box-shadow:0 -20px 60px -10px rgba(0,0,0,.7);
  transform:translateY(100%);transition:transform .38s var(--ease-spring);
  z-index:71;display:flex;flex-direction:column;
}
.sheet.show{transform:translateY(0)}
.sheet .grabber{width:36px;height:4px;border-radius:100px;background:var(--p-border-2);margin:10px auto 4px}

/* ============ RESPONSIVE ============ */
@media (max-width:460px){
  .stage{padding:14px 8px 40px;gap:12px}
  .phone-shell{width:100%;height:calc(100vh - 100px);max-height:820px;padding:10px;border-radius:44px}
  .phone-shell::before, .phone-shell::after{display:none}
  .viewport{border-radius:34px}
}

const fmtDate = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
};
const fmtTime = iso => new Date(iso).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:true });
const emojiForType = t => ({food_tour:'🍲', heritage_walk:'🕌', activity:'⛰️', event:'🎻', hotel:'🏨', bundle:'🚗'}[t] || '📍');

function showToast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

const SB = () => $('#screenViewport');
const VP = () => $('#viewport');
const TAB_SCREENS = ['home','search','trips','profile'];

function setTabbar(show, active) {
  VP().classList.toggle('show-tabbar', !!show);
  document.querySelectorAll('.tabbtn').forEach(b => {
    b.classList.toggle('on', b.getAttribute('data-tab') === active);
  });
}
function goto(screen, opts) {
  opts = opts || {};
  if (opts.reset) state.screenStack = [];
  if (!opts.replace) state.screenStack.push(screen);
  else state.screenStack[state.screenStack.length-1] = screen;
  render(screen);
}
function back() {
  if (state.screenStack.length > 1) {
    state.screenStack.pop();
    render(state.screenStack[state.screenStack.length-1]);
  }
}
function statusBar() {
  return el('div', {class:'statusbar'},
    el('span',{},'9:41'),
    el('span',{class:'icons', html:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a16 16 0 0 1 20 0M5.5 12a11 11 0 0 1 13 0M9 15.5a6 6 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg><span class="sb-bat"><i></i></span>'})
  );
}
function iconBack(){ return el('button',{class:'icon-btn', onclick: back}, ...[svg('m15 18-6-6 6-6', 2.2)]); }
function svg(d, sw){
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor'); s.setAttribute('stroke-width', sw||2);
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', d);
  s.appendChild(p);
  return s;
}

// ============ RENDER ROUTER ============
function render(screen) {
  const sv = SB();
  sv.innerHTML = '';
  state.screen = screen;
  const isTab = TAB_SCREENS.includes(screen);
  setTabbar(isTab, screen);
  let node;
  try {
    switch(screen) {
      case 'auth':      node = renderAuth(); break;
      case 'onboard':   node = renderOnboard(); break;
      case 'home':      node = renderHome(); break;
      case 'search':    node = renderSearch(); break;
      case 'listing':   node = renderListing(); break;
      case 'book':      node = renderBook(); break;
      case 'checkout':  node = renderCheckout(); break;
      case 'confirm':   node = renderConfirm(); break;
      case 'wallet':    node = renderWallet(); break;
      case 'trips':     node = renderTrips(); break;
      case 'profile':   node = renderProfile(); break;
      case 'admin':     node = renderAdmin(); break;
      case 'admin-edit':node = renderAdminEdit(); break;
      default:          node = el('div',{class:'loading'}, 'Not found: '+screen);
    }
  } catch (e) {
    console.error(e);
    node = el('div',{class:'loading'}, 'Error: '+e.message);
  }
  node.classList.add('screen','active');
  if (isTab) node.classList.add('with-tabbar');
  sv.appendChild(node);
}

async function handleAuthSubmit() {
  const btn = $('#auth-submit');
  const errBox = $('#auth-err');
  errBox.style.display = 'none';
  btn.disabled = true;
  let email = $('#inp-email').value.trim();
  const password = $('#inp-pass').value;
  // shortcut: allow signing in as "yash" (auto-append the admin domain)
  if (state.auth.mode === 'signin' && email && !email.includes('@')) {
    email = email + '@mumbaiinsider.app';
  }
  try {
    if (state.auth.mode === 'signin') {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) throw error;
      await loadSession();
      showToast('Welcome back' + (state.profile?.full_name ? ', ' + state.profile.full_name.split(' ')[0] : '') + '!', 'success');
      goto(state.profile?.onboarding_complete ? 'home' : 'onboard', {reset:true});
    } else {
      const name = $('#inp-name').value.trim();
      const { error } = await supabase.auth.signUp({
        email, password,
        options: { data: { full_name: name } }
      });
      if (error) throw error;
      // auto-confirm trigger fires server-side; sign in immediately for a smooth demo
      const { error: signInErr } = await supabase.auth.signInWithPassword({ email, password });
      if (signInErr) throw signInErr;
      await loadSession();
      showToast('Welcome to Mumbai Insider!', 'success');
      goto('onboard', {reset:true});
    }
  } catch (e) {
    errBox.textContent = e.message || 'Something went wrong';
    errBox.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function loadSession() {
  const { data: { session } } = await supabase.auth.getSession();
  state.user = session?.user || null;
  if (state.user) {
    const { data: p } = await supabase.from('profiles').select('*').eq('id', state.user.id).single();
    state.profile = p;
  } else {
    state.profile = null;
  }
}

function spinnerSvg() {
  const s = document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 24 24');
  s.setAttribute('fill','none');
  s.setAttribute('stroke','currentColor');
  s.setAttribute('stroke-width','2.4');
  s.innerHTML = '<circle cx="12" cy="12" r="9" stroke-opacity=".25"/><path d="M21 12a9 9 0 0 1-9 9"/>';
  return s;
}
function renderListingList(container, items) {
  container.innerHTML = '';
  if (!items.length) {
    container.appendChild(el('div',{class:'empty'}, 'Nothing here yet.'));
    return;
  }
  for (const l of items) {
    const c = el('div',{class:'lcard', onclick: () => openListing(l)});
    const thumb = el('div',{class:'thumb'});
    if (l.cover_image && l.cover_image.startsWith('http')) {
      thumb.appendChild(el('img',{src:l.cover_image, alt:l.title, loading:'lazy', onerror:'this.style.display=\'none\';this.parentElement.innerHTML=\''+emojiForType(l.type)+'\';'}));
    } else {
      thumb.textContent = l.cover_image || emojiForType(l.type);
    }
    c.appendChild(thumb);
    const meta = el('div',{class:'meta'});
    if (l.rating > 0) meta.appendChild(el('span',{class:'star'}, `★ ${(+l.rating).toFixed(1)}`));
    if (l.rating_count > 0) meta.appendChild(el('span',{}, `${l.rating_count} reviews`));
    if (l.duration_minutes) {
      meta.appendChild(el('span',{},'·'));
      meta.appendChild(el('span',{}, l.duration_minutes >= 60 ? Math.round(l.duration_minutes/60) + ' hrs' : l.duration_minutes+' min'));
    }
    if (l.editors_pick) meta.appendChild(el('span',{class:'badge hot'},'Editor\'s pick'));
    c.appendChild(el('div',{class:'info'},
      el('h5',{}, l.title),
      meta,
      el('div',{class:'price'}, fmtRs(l.base_price_paise/100), el('small',{},' / person'))
    ));
    container.appendChild(c);
  }
}
async function setCategoryFilter(cat) {
  document.querySelectorAll('#cat-pills .pill').forEach(p => p.classList.toggle('on', p.getAttribute('data-cat') === cat));
  const list = $('#listings-list');
  list.innerHTML = '';
  list.appendChild(el('div',{class:'loading'}, spinnerSvg()));
  const items = await loadListings(cat || null);
  renderListingList(list, items);
}
async function loadCategories() {
  if (state.categories.length) return state.categories;
  const { data, error } = await supabase.from('categories').select('*').eq('active', true).order('sort_order');
  if (error) { console.error(error); return []; }
  state.categories = data;
  return data;
}
async function loadListings(cat) {
  let q = supabase.from('listings').select('*').eq('active', true).order('featured', {ascending:false}).order('booking_count', {ascending:false}).limit(20);
  if (cat) q = q.eq('category_slug', cat);
  const { data, error } = await q;
  if (error) { console.error(error); return []; }
  return data;
}

function share(l) {
  const url = window.location.href;
  if (navigator.share) navigator.share({title:l.title, url}).catch(()=>{});
  else if (navigator.clipboard) { navigator.clipboard.writeText(url); showToast('Link copied','success'); }
}

      el('button',{onclick:()=>{ if (state.guests>1){ state.guests--; render('book'); } }},'−'),
      el('b',{class:'mono'}, String(state.guests)),
      el('button',{onclick:()=>{ if (state.guests<12){ state.guests++; render('book'); } }},'+')
    )
  );
  const cta = el('div',{style:'padding:14px 20px 30px'},
    el('button',{class:'btn btn-primary btn-block', id:'book-cta', disabled:'', onclick:()=>goto('checkout')}, 'Choose a slot to continue')
  );

  w.appendChild(el('div',{class:'eyebrow', style:'padding:2px 20px 8px'}, 'Upcoming slots'));
  w.appendChild(daysWrap);
  w.appendChild(el('div',{class:'sec-head'}, el('h4',{},'Slots'), el('a',{class:'mono', id:'slot-count'},'')));
  w.appendChild(slotsWrap);
  w.appendChild(stepperRow);
  w.appendChild(totalRow);
  w.appendChild(cta);

  // load availability
  slotsWrap.innerHTML = '';
  slotsWrap.appendChild(el('div',{class:'loading'}, spinnerSvg()));
  loadAvailability(l.id).then(slots => {
    state.currentAvailability = slots;
    if (!slots.length) {
      slotsWrap.innerHTML = '';
      slotsWrap.appendChild(el('div',{class:'empty', style:'grid-column:1/-1'},'No slots available.'));
      $('#slot-count').textContent = '';
      return;
    }
    // group slots by day
    const days = [...new Set(slots.map(s => s.starts_at.split('T')[0]))].sort();
    const selDay = state.selectedSlot ? state.selectedSlot.starts_at.split('T')[0] : days[0];
    for (const d of days) {
      const dObj = new Date(d);
      const item = el('div',{class:'day' + (d === selDay ? ' sel' : ''), onclick: () => { state.selectedSlot = null; state.selectedDay = d; renderSlots(d); document.querySelectorAll('.day').forEach(x=>x.classList.remove('sel')); item.classList.add('sel'); }},
        el('div',{class:'d'}, dObj.toLocaleDateString('en-IN',{weekday:'short'})),
        el('div',{class:'n mono'}, String(dObj.getDate())),
        el('div',{class:'s'})
      );
      daysWrap.appendChild(item);
    }
    renderSlots(selDay);
  });

  function renderSlots(day) {
    slotsWrap.innerHTML = '';
    const slots = state.currentAvailability.filter(s => s.starts_at.startsWith(day));
    $('#slot-count').textContent = slots.length + ' available';
    slots.forEach(s => {
      const remaining = s.capacity - s.booked;
      const sold = remaining <= 0;
      const few = remaining > 0 && remaining <= 3;
      const sel = state.selectedSlot?.id === s.id;
      const cls = 'slot' + (sold?' sold':'') + (few?' few':'') + (sel?' sel':'');
      slotsWrap.appendChild(el('div',{class:cls, onclick: () => {
        if (sold) return;
        state.selectedSlot = s;
        render('book');
      }},
        el('div',{class:'t mono'}, fmtTime(s.starts_at)),
        el('div',{class:'s'}, sold?'Sold out': few? `${remaining} spots left` : 'Available')
      ));
    });
    if (state.selectedSlot) {
      $('#book-cta').disabled = false;
      $('#book-cta').textContent = 'Continue to payment';
    }
  }

  return w;
}
async function loadAvailability(listingId) {
  const nowIso = new Date().toISOString();
  const { data, error } = await supabase.from('availability')
    .select('*').eq('listing_id', listingId).eq('active', true)
    .gte('starts_at', nowIso).order('starts_at').limit(40);
  if (error) { console.error(error); return []; }
  return data;
}

  ));

    el('button',{class:'btn btn-primary btn-block', id:'pay-btn', onclick: doBooking},
      el('span',{}, 'Confirm & pay '), el('span',{class:'mono', style:'margin-left:4px'}, fmtRs(total)))
  ));

async function doBooking() {
  const btn = $('#pay-btn');
  btn.disabled = true;
  btn.innerHTML = '';
  const s = spinnerSvg(); s.style.width='18px';s.style.height='18px';s.style.color='#160805';
  btn.appendChild(s);
  btn.appendChild(document.createTextNode(' Booking…'));
  try {
    const { data, error } = await supabase.rpc('create_booking', {
      p_listing_id: state.currentListing.id,
      p_availability_id: state.selectedSlot.id,
      p_guests: state.guests,
      p_points_redeem: 0
    });
    if (error) throw error;
    // simulate payment success: mark confirmed + award points
    await supabase.from('bookings').update({
      status: 'confirmed', payment_status: 'captured', confirmed_at: new Date().toISOString(),
      razorpay_payment_id: 'demo_' + Date.now()
    }).eq('id', data.id);
    await supabase.rpc('award_booking_points', { p_booking_id: data.id });
    state.currentBooking = data;
    showToast('Booking confirmed!', 'success');
    goto('confirm');
  } catch (e) {
    showToast(e.message || 'Booking failed', 'error');
    btn.disabled = false;
    btn.textContent = 'Try again';
  }
}

    field('Max guests', 'f-cap', edit?.max_group_size, {type:'number', ph:'12'})
  ));
  const catOpts = [{v:'', label:'— Select —'}, ...state.categories.map(c => ({v:c.slug, label:c.name}))];
  const typeOpts = [
    {v:'food_tour', label:'Food tour'},
    {v:'heritage_walk', label:'Heritage walk'},
    {v:'activity', label:'Activity'},
    {v:'event', label:'Event'},
    {v:'hotel', label:'Hotel'},
    {v:'bundle', label:'Bundle'},
  ];
  w.appendChild(el('div',{class:'form-row'},
    field('Category', 'f-cat', edit?.category_slug || '', {select:true, options: catOpts}),
    field('Type', 'f-type', edit?.type || 'activity', {select:true, options: typeOpts})
  ));
  w.appendChild(field('Meeting point', 'f-meet', edit?.meeting_point, {ph:'Crawford Market gate'}));
  w.appendChild(el('div',{class:'form-field'},
    el('label',{},'Status'),
    el('div',{style:'display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--p-surface);border:1px solid var(--p-border);border-radius:12px'},
      el('span',{style:'flex:1;font-size:13px'}, 'Visible to users'),
      el('button',{class:'toggle' + (edit?.active !== false ? ' on' : ''), id:'f-active', onclick: function(){ this.classList.toggle('on'); }}, el('i',{}))
    )
  ));
  const errBox = el('div',{class:'err', id:'edit-err', style:'display:none;margin:0 20px 12px'});
  w.appendChild(errBox);
  const actions = el('div',{style:'display:flex;gap:10px;padding:6px 20px 30px'});
  if (edit) actions.appendChild(el('button',{class:'btn btn-danger btn-sm', style:'flex:0 0 auto', onclick: () => deleteListing(edit.id)}, 'Delete'));
  actions.appendChild(el('button',{class:'btn btn-primary btn-block', style:'flex:1', id:'save-btn', onclick: () => saveListing(edit)}, isNew ? 'Publish listing' : 'Save changes'));
  w.appendChild(actions);

  // load categories if empty
  if (!state.categories.length) loadCategories().then(() => render('admin-edit'));
  return w;
}

async function saveListing(existing) {
  const btn = $('#save-btn');
  const err = $('#edit-err');
  err.style.display = 'none';
  btn.disabled = true;
  try {
    const title = $('#f-title').value.trim();
    if (!title) throw new Error('Title is required');
    const price = parseInt($('#f-price').value || '0', 10);
    if (!price || price < 1) throw new Error('Enter a valid price in ₹');
    const type = $('#f-type').value;
    const active = $('#f-active').classList.contains('on');
    const cover = state.admin.uploadedUrl || existing?.cover_image || null;
    const slug = existing?.slug || (title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + Date.now().toString(36));
    // pick an existing operator (admin creates listings under the first verified operator for now)
    let operatorId = existing?.operator_id;
    if (!operatorId) {
      const { data: op } = await supabase.from('operators').select('id').limit(1).single();
      operatorId = op?.id;
      if (!operatorId) throw new Error('No operator found in DB');
    }
    const row = {
      operator_id: operatorId,
      slug,
      type,
      title,
      subtitle: $('#f-subtitle').value.trim() || null,
      description: $('#f-desc').value.trim() || null,
      neighbourhood: $('#f-nbr').value.trim() || null,
      meeting_point: $('#f-meet').value.trim() || null,
      duration_minutes: parseInt($('#f-dur').value||'0',10) || null,
      max_group_size: parseInt($('#f-cap').value||'0',10) || null,
      base_price_paise: price * 100,
      cover_image: cover,
      category_slug: $('#f-cat').value || null,
      active,
    };
    const { error } = existing
      ? await supabase.from('listings').update(row).eq('id', existing.id)
      : await supabase.from('listings').insert(row);
    if (error) throw error;
    showToast(existing ? 'Listing updated' : 'Listing published', 'success');
    back();
  } catch (e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
}

async function deleteListing(id) {
  if (!confirm('Delete this listing? This cannot be undone.')) return;
  const { error } = await supabase.from('listings').delete().eq('id', id);
  if (error) { showToast(error.message, 'error'); return; }
  showToast('Listing deleted', 'success');
  back();
}

// ============ SCREEN: WALLET (single ticket view kept for later) ============
function renderWallet() { goto('trips', {reset:true}); return el('div',{}); }

// ============ TAB BAR EVENTS ============
document.querySelectorAll('.tabbtn').forEach(b => b.addEventListener('click', () => {
  goto(b.getAttribute('data-tab'), {reset:true});
}));

// ============ BOOT ============
(async () => {
  await loadSession();
  await loadCategories();
  if (state.user) {
    if (state.profile?.onboarding_complete) goto('home',{reset:true});
    else goto('onboard',{reset:true});
  } else {
    goto('auth',{reset:true});
  }
})();

// keep session sync
supabase.auth.onAuthStateChange((_evt, session) => {
  state.user = session?.user || null;
});
</script>
